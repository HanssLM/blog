<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Login | TechInPulse</title>
    <meta name="description" content="Blog">
    <meta name="author" content="Hans Lao Moncusi">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body>
    <header class="blog-hero">
        <div class="hero-inner">
            <p class="hero-kicker">ACCÉS</p>
            <h1 class="hero-title">TechInPulse</h1>
            <p class="hero-subtitle">Inicia sessió per accedir al teu compte i continuar publicant.</p>
        </div>
    </header>
    <nav class="nav-superior" aria-label="Menú principal">
        <input class="nav-toggle" type="checkbox" id="navToggle">
        <label class="nav-boton" for="navToggle" aria-label="Abrir o cerrar menú">
            <i class="fas fa-bars" aria-hidden="true"></i>
        </label>
        <ul class="barra-nav">
            <li><a href="./../index.html"><i class="fas fa-home"></i>&nbsp;Inici</a></li>
            <li><a href="./../posts/posts.html"><i class="fas fa-newspaper"></i>&nbsp;Articles</a></li>
            <li><a href="./../about/about.html"><i class="fas fa-users"></i>&nbsp;Sobre mi</a></li>
            <li><a href="./../contact/contact.html"><i class="fas fa-envelope"></i>&nbsp;Contacte</a></li>
            <li><a href="./login.html"><i class="fas fa-sign-in-alt"></i>&nbsp;Accedir</a></li>
            <li><a href="./../register/register.html"><i class="fas fa-user-plus"></i>&nbsp;Registre</a></li>
        </ul>
    </nav>

    <main class="pagina-login">
        <section class="zona-login" aria-label="Inicio de sesión">
            <div class="tarjeta-login">
                <h2 class="titulo-login">Iniciar sesión</h2>

                <div class="redes" aria-label="Acceso social">
                    <a href="#" class="boton-red" aria-label="Continuar con Facebook"><i class="fab fa-facebook-f" aria-hidden="true"></i></a>
                    <a href="#" class="boton-red" aria-label="Continuar con Google"><i class="fab fa-google" aria-hidden="true"></i></a>
                    <a href="#" class="boton-red" aria-label="Continuar con LinkedIn"><i class="fab fa-linkedin-in" aria-hidden="true"></i></a>
                </div>

                <p class="texto-cuenta">O usa tu cuenta</p>
                <p id="mensajeLogin" class="mensaje-form" role="status" aria-live="polite"></p>

                <form id="formLogin" class="formulario-login" action="#" method="get" novalidate>
                    <input class="campo" type="email" name="email" autocomplete="email" placeholder="Email" required>
                    <input class="campo" type="password" name="password" autocomplete="current-password" placeholder="Contraseña" minlength="6" required>
                    <a class="enlace" href="#">¿Olvidaste tu contraseña?</a>

                    <div class="captcha">
                        <div class="g-recaptcha" data-sitekey="6LfVKXYsAAAAABd1uQITmIUiOx0s_9YTTzvIUh23"></div>
                    </div>

                    <button class="boton-principal" type="submit">Entrar</button>
                </form>

                <a class="enlace-crear" href="./../register/register.html">Crear cuenta</a>
            </div>
        </section>
    </main>

    <footer>
        &copy; 2025 Educem SMX 1A · Página creada por Hans Lao Moncusi
    </footer>

    <script type="module" src="./js/login.js"></script>

</body>

</html>
