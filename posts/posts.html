<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>M8 Aplicacions Web</title>
    <meta name="description" content="Plantilla HTML v1.0">
    <meta name="author" content="Hans Lao Moncusi">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <header class="blog-hero">
        <div class="hero-inner">
            <p class="hero-kicker">PUBLICACIONS</p>
            <h1 class="hero-title">Explora els últims articles</h1>
            <p class="hero-subtitle">Guies, idees i novetats. Troba el que t’interessa i continua llegint.</p>
        </div>
    </header>

    <nav class="nav-principal" aria-label="Navegación principal">
        <ul class="nav-lista">
            <li><a href="./../index.html"><i class="fas fa-home"></i>&nbsp;Inici</a></li>
            <li><a href="./../posts/posts.html" aria-current="page"><i class="fas fa-newspaper"></i>&nbsp;Articles</a></li>
            <li><a href="./../about/about.html"><i class="fas fa-users"></i>&nbsp;Sobre Nosaltres</a></li>
            <li><a href="./../contact/contact.html"><i class="fas fa-envelope"></i>&nbsp;Contacte</a></li>
            <li><a href="./../login/login.html"><i class="fas fa-sign-in-alt"></i>&nbsp;Accedir</a></li>
            <li><a href="./../register/register.html"><i class="fas fa-user-plus"></i>&nbsp;Registre</a></li>
        </ul>
    </nav>
    <main>

        <div class="posts-contenedor">
            <p id="estadoAuth" class="estado-auth" role="status" aria-live="polite"></p>
            <p id="msgPost" class="mensaje-form" role="status" aria-live="polite"></p>

            <section class="posts-toolbar" aria-label="Accions i filtres">
                <div class="posts-toolbar-inner">
                    <a class="toolbar-btn toolbar-btn-primary" href="#bloqueCrearPost">Crear post</a>
                    <details id="filtresPosts" class="toolbar-filtres">
                        <summary class="toolbar-btn toolbar-btn-ghost">Filtres</summary>
                        <div class="toolbar-filtres-panel" aria-label="Filtres de posts">
                            <form id="formFiltres" class="form-filtres" action="#" method="get" novalidate>
                                <div class="filtres-grid">
                                    <div class="filtre-campo">
                                        <label class="campo-label" for="filtreText">Cerca</label>
                                        <div class="search-form" role="search">
                                            <button type="button" class="search-btn" aria-label="Buscar">
                                                <svg width="17" height="16" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="search">
                                                    <path d="M7.667 12.667A5.333 5.333 0 107.667 2a5.333 5.333 0 000 10.667zM14.334 14l-2.9-2.9" stroke="currentColor" stroke-width="1.333" stroke-linecap="round" stroke-linejoin="round"></path>
                                                </svg>
                                            </button>
                                            <input id="filtreText" class="search-input" placeholder="Buscar per títol o contingut..." type="text" name="q">
                                            <button id="btnClearSearch" class="search-reset" type="button" aria-label="Netejar cerca">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                                                </svg>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="filtre-campo">
                                        <label class="campo-label" for="filtreTag">Categoria</label>
                                        <select id="filtreTag" name="tag">
                                            <option value="">Totes</option>
                                        </select>
                                    </div>
                                    <div class="filtre-campo">
                                        <label class="campo-label" for="filtreSort">Ordenar</label>
                                        <select id="filtreSort" name="sort">
                                            <option value="new">Més recents</option>
                                            <option value="old">Més antics</option>
                                            <option value="title">Títol (A-Z)</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="filtres-actions">
                                    <button id="btnResetFiltres" type="reset" class="filtres-reset">Netejar</button>
                                </div>
                            </form>
                        </div>
                    </details>
                </div>
            </section>

            <section id="bloqueCrearPost" class="bloque bloque-form" aria-label="Crear post">
                <details class="crear-posts">
                    <summary class="crear-posts-summary">Crear post</summary>
                    <form id="formPost" class="form-post" action="#" method="get" novalidate style="display:none;">

                        <label class="campo-label" for="title">Título</label>
                        <input id="title" type="text" name="title" placeholder="Título" required>

                        <label class="campo-label" for="content">Contenido</label>
                        <textarea id="content" name="content" placeholder="Contenido" rows="6" required></textarea>

                        <label class="check-publicado">
                            <input type="checkbox" name="published" checked>
                            Publicado
                        </label>

                        <button type="submit">Crear post</button>
                    </form>
                </details>
            </section>

            <section class="bloque bloque-lista" aria-label="Listado de posts">
                <h3 class="bloque-titulo">Posts</h3>
                <section id="listaPosts" class="lista-posts" aria-label="Listado de posts"></section>
                <nav id="paginacionPosts" class="paginacion" aria-label="Paginación de posts"></nav>
            </section>
        </div>

    </main>
    <footer>
        &copy; 2025 Educem SMX 1A · Página creada por Hans Lao Moncusi
    </footer>

    <script type="module" src="./js/posts.js"></script>
</body>

</html>
