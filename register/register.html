<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Registre | TechInPulse</title>
    <meta name="description" content="Blog">
    <meta name="author" content="Hans Lao Moncusi">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body>
    <header>
        <h1>TechInPulse</h1>
    </header>
    <nav>
        <ul class="barra-nav">
            <li><a href="./../index.html"><i class="fas fa-home"></i>&nbsp;Inici</a></li>
            <li><a href="./../posts/posts.html"><i class="fas fa-newspaper"></i>&nbsp;Articles</a></li>
            <li><a href="./../about/about.html"><i class="fas fa-users"></i>&nbsp;Sobre Nosaltres</a></li>
            <li><a href="./../contact/contact.html"><i class="fas fa-envelope"></i>&nbsp;Contacte</a></li>
            <li><a href="./../login/login.html"><i class="fas fa-sign-in-alt"></i>&nbsp;Accedir</a></li>
            <li><a href="./register.html"><i class="fas fa-user-plus"></i>&nbsp;Registre</a></li>
        </ul>
    </nav>
    <main class="pagina-register">
        <section class="zona-register" aria-label="Crear cuenta">
            <div class="tarjeta-register">
                <h2 class="titulo-register">Crear cuenta</h2>
                <p class="texto-cuenta">Completa el formulario para registrarte</p>
                <p id="mensajeRegister" class="mensaje-form" role="status" aria-live="polite"></p>

                <form id="formRegister" class="formulario-register" action="#" method="get" novalidate>
                    <input class="campo" type="text" name="nombre" autocomplete="name" placeholder="Nombre" required>
                    <input class="campo" type="text" name="apellidos" autocomplete="family-name" placeholder="Apellidos" required>
                    <input class="campo" type="email" name="email" autocomplete="email" placeholder="Email" required>
                    <input class="campo" type="password" name="password" autocomplete="new-password" placeholder="Contraseña" minlength="6" required>
                    <input class="campo" type="password" name="password_confirm" autocomplete="new-password" placeholder="Repite la contraseña" minlength="6" required>

                    <div class="captcha">
                        <div class="g-recaptcha" data-sitekey="6LfVKXYsAAAAABd1uQITmIUiOx0s_9YTTzvIUh23"></div>
                    </div>

                    <label class="fila-check">
                        <input class="check" type="checkbox" name="terminos" required>
                        <span>Acepto los términos</span>
                    </label>

                    <button class="boton-principal" type="submit">Registrarse</button>
                </form>

                <a class="enlace-crear" href="./../login/login.html">Ya tengo cuenta</a>
            </div>
        </section>
    </main>
    <footer>
        &copy; 2025 Educem SMX 1A · Página creada por Hans Lao Moncusi
    </footer>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAjwFzt5h5lbjjOzhG0TtFHfbstsna98NI",
            authDomain: "blog-68913.firebaseapp.com",
            projectId: "blog-68913",
            storageBucket: "blog-68913.firebasestorage.app",
            messagingSenderId: "735969933987",
            appId: "1:735969933987:web:a10854bb9f67c8fbd51d16",
            measurementId: "G-98QJJPP1Q0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('formRegister');
        const mensaje = document.getElementById('mensajeRegister');

        function setMensaje(texto, esError) {
            if (!mensaje) return;
            mensaje.textContent = texto;
            mensaje.dataset.tipo = esError ? 'error' : 'ok';
        }

        if (form) {
            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                const nombre = form.elements['nombre']?.value?.trim() || '';
                const apellidos = form.elements['apellidos']?.value?.trim() || '';
                const email = form.elements['email']?.value?.trim() || '';
                const password = form.elements['password']?.value || '';
                const passwordConfirm = form.elements['password_confirm']?.value || '';
                const terminos = form.elements['terminos']?.checked;

                const captchaToken = window.grecaptcha?.getResponse?.() || '';
                if (!captchaToken) {
                    setMensaje('Completa el reCAPTCHA.', true);
                    return;
                }

                if (!terminos) {
                    setMensaje('Debes aceptar los términos.', true);
                    return;
                }

                if (password !== passwordConfirm) {
                    setMensaje('Las contraseñas no coinciden.', true);
                    return;
                }

                try {
                    setMensaje('Creando cuenta...', false);
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    const displayName = (nombre + ' ' + apellidos).trim();
                    if (displayName) {
                        await updateProfile(cred.user, { displayName });
                    }
                    window.grecaptcha?.reset?.();
                    setMensaje('Cuenta creada. Ya puedes iniciar sesión.', false);
                    window.location.href = './../login/login.html';
                } catch (err) {
                    const code = err?.code || '';
                    let texto = 'Error al crear la cuenta.';
                    if (code === 'auth/email-already-in-use') texto = 'Ese email ya está registrado.';
                    if (code === 'auth/invalid-email') texto = 'Email no válido.';
                    if (code === 'auth/weak-password') texto = 'La contraseña es demasiado débil.';
                    window.grecaptcha?.reset?.();
                    console.error(err);
                    const sufijo = code ? ` (${code})` : '';
                    setMensaje(texto + sufijo, true);
                }
            });
        }
    </script>
</body>

</html>
